name: dbt CI/CD Pipeline

on:
  push:
    branches:
      - main
      - revamp/2026
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pipeline_run_id:
        description: 'ADF Pipeline Run ID'
        required: false
        type: string
      load_date:
        description: 'Date for partition processing'
        required: false
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt dependencies
        run: dbt deps --profiles-dir .

      - name: Run dbt build
        run: dbt build --profiles-dir .
